
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>دم | قهوه و دم‌آوری تخصصی</title>

    <meta
        name="description"
        content="دم؛ قهوه و دم‌آوری در شیراز."
    >

    <meta name="robots" content="index, follow">

    <link
        rel="icon"
        href="images/logo.jpg"
        type="image/jpeg"
    >

    <link
        rel="canonical"
        href="https://mohahanin.github.io/damlocal/"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main>


        <!-- =========================================
             MOTION 01 — BREWING
        ========================================== -->

        <section
            class="motion-section motion-brewing reveal-section"
        >

            <video
                class="motion-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                aria-hidden="true"
            >
                <source
                    src="video/cascara.mp4"
                    type="video/mp4"
                >
            </video>

            <div class="motion-overlay"></div>


            <header class="site-header">

                <a
                    href="https://instagram.com/damlocal"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="brand-link"
                    aria-label="صفحه اینستاگرام دم"
                >
                    <img
                        src="images/logo.jpg"
                        alt="دم"
                        class="brand-logo"
                    >
                </a>


                <a
                    href="menu.html"
                    class="landing-menu-link"
                >
                    منو
                </a>

            </header>


            <div class="hero-content">

                <h1>
                    دم
                </h1>

                <p>
                    یک لحظه، یک نفس، یک دم‌آوری
                </p>

            </div>

        </section>



        <!-- =========================================
             MOTION 02 — PLACE
        ========================================== -->

        <section
            class="motion-section motion-place reveal-section"
        >

            <video
                class="motion-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                aria-hidden="true"
            >
                <source
                    src="video/story3.mp4"
                    type="video/mp4"
                >
            </video>

            <div class="motion-overlay"></div>


            <div class="place-content">


                <!-- STORE IMAGE -->

                <div class="place-image">

                    <picture>

                        <source
                            media="(max-width: 699px)"
                            srcset="images/storefront-mobile.jpg"
                        >

                        <img
                            src="images/damlocal.jpg"
                            alt="نمای دم"
                            loading="lazy"
                        >

                    </picture>

                </div>



                <!-- STORE INFORMATION -->

                <div class="place-info">

                    <p>
                        شیراز
                    </p>


                    <p>
                        انتهای نمازی ستارخان<br>
                        خیابان کوهبر<br>
                        نرسیده به کوچه چهار
                    </p>


                    <p>
                        هر روز<br>
                        ۷:۳۰ — ۲۲:۰۰
                    </p>



                    <!-- CONTACT LINKS -->

                    <div class="place-contact">


                        <!-- INSTAGRAM -->

                        <a
                            href="https://instagram.com/damlocal"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="contact-link"
                            dir="ltr"
                            aria-label="اینستاگرام دم"
                        >

                            <svg
                                class="contact-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.6"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <rect
                                    x="3"
                                    y="3"
                                    width="18"
                                    height="18"
                                    rx="5"
                                ></rect>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="4"
                                ></circle>

                                <circle
                                    cx="17.5"
                                    cy="6.5"
                                    r="0.7"
                                    fill="currentColor"
                                    stroke="none"
                                ></circle>
                            </svg>


                            <span>
                                @damlocal
                            </span>

                        </a>



                        <!-- PHONE -->

                        <a
                            href="tel:+989179198344"
                            class="contact-link"
                            dir="ltr"
                            aria-label="تماس با دم"
                        >

                            <svg
                                class="contact-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.6"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path
                                    d="M22 16.92v3a2 2 0 0 1-2.18 2
                                    19.79 19.79 0 0 1-8.63-3.07
                                    19.5 19.5 0 0 1-6-6
                                    19.79 19.79 0 0 1-3.07-8.67
                                    A2 2 0 0 1 4.11 2h3
                                    a2 2 0 0 1 2 1.72
                                    12.84 12.84 0 0 0 .7 2.81
                                    2 2 0 0 1-.45 2.11L8.09 9.91
                                    a16 16 0 0 0 6 6l1.27-1.27
                                    a2 2 0 0 1 2.11-.45
                                    12.84 12.84 0 0 0 2.81.7
                                    A2 2 0 0 1 22 16.92z"
                                ></path>
                            </svg>


                            <span>
                                ۰۹۱۷ ۹۱۹ ۸۳۴۴
                            </span>

                        </a>


                    </div>

                </div>

            </div>

        </section>



        <!-- =========================================
             MOTION 03 — CLOSING
        ========================================== -->

        <section
            class="motion-section motion-closing reveal-section"
        >

            <video
                class="motion-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                aria-hidden="true"
            >
                <source
                    src="video/story.mp4"
                    type="video/mp4"
                >
            </video>

            <div class="motion-overlay"></div>


            <div class="closing-content">

                <h2>
                    دم
                </h2>

                <p>
                    یک دم
                </p>

                <p>
                    یک لحظه
                </p>

            </div>

        </section>



        <!-- =========================================
             FOOTER
        ========================================== -->

        <footer class="site-footer">

            <span>
                دم
            </span>

            <span>
                شیراز
            </span>

        </footer>


    </main>


    <script src="script.js"></script>

</body>
</html>
