<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دم — شیراز</title>

  <meta
    name="description"
    content="دم — شیراز"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Estedad:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <!-- Background video -->

  <div class="background-video" aria-hidden="true">

    <video
      autoplay
      muted
      loop
      playsinline
      poster="images/cascara.jpg"
    >
      <source
        src="video/cascara.mp4"
        type="video/mp4"
      >
    </video>

  </div>


  <header class="site-header">

    <a href="https://www.instagram.com/damlocal/" target="_blank" rel="noopener" class="logo" aria-label="دم">
      <img
        src="images/logo.jpg"
        alt="دم"
      >
    </a>

    <span class="location">
      شیراز
    </span>

  </header>


  <main>

    <!-- HERO -->

    <section class="hero">

      <div class="hero-content">

        <span class="hero-name">
          damlocal
        </span>

        <h1>
          دم
        </h1>

      </div>

      <div class="hero-bottom">

        <span>
          شیراز
        </span>

        <span>
          دم‌آوری
        </span>

      </div>

    </section>

    <!-- CASCARA -->

    <section class="cascara">

      <div class="cascara-image">

        <img
          src="images/cascara.jpg"
          alt="کاسکارا"
        >

      </div>

      <div class="cascara-label" dir="ltr">
        <a
          href="https://www.instagram.com/damlocal/"
          target="_blank"
          rel="noopener"
        >
          @damlocal
        </a>
      </div>

    </section>


    <!-- PLACE – with details stacked on the bottom right -->

    <section class="place">

      <div class="place-image">

        <img
          src="images/storefront.jpg"
          alt="دم، شیراز"
        >

      </div>

      <!-- Three lines, stacked, aligned to the right -->
      <div class="place-meta">
        <span>شیراز</span>
        <span>انتها نمازی ستارخان، خیابان کوهبر، نرسیده به کوچه چهار</span>
        <span>۷:۳۰ تا ۲۲</span>
      </div>

    </section>


    <!-- CLOSING -->

    <section class="closing">

      <div class="closing-video" aria-hidden="true">
        <video autoplay muted loop playsinline>
          <source src="video/story.mp4" type="video/mp4">
        </video>
      </div>

      <span>
        دم
      </span>

      <h2>
        یک دم
      </h2>

    </section>

  </main>


  <footer class="site-footer">

    <span>
      دم
    </span>

    <span>
      شیراز
    </span>

  </footer>

</body>

</html>
