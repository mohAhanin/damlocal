
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>دم | قهوه و دم‌آوری تخصصی</title>

    <meta
        name="description"
        content="دم؛ قهوه و دم‌آوری در شیراز."
    >

    <meta name="robots" content="index, follow">

    <link
        rel="icon"
        href="images/logo.jpg"
        type="image/jpeg"
    >

    <link
        rel="canonical"
        href="https://mohahanin.github.io/damlocal/"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main>


        <!-- =========================================
             MOTION 01 — BREWING
        ========================================== -->

        <section
            class="motion-section motion-brewing reveal-section"
        >

            <video
                class="motion-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                aria-hidden="true"
            >
                <source
                    src="video/cascara.mp4"
                    type="video/mp4"
                >
            </video>

            <div class="motion-overlay"></div>


            <header class="site-header">

                <a
                    href="https://instagram.com/damlocal"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="brand-link"
                >
                    <img
                        src="images/logo.jpg"
                        alt="دم"
                        class="brand-logo"
                    >
                </a>

                <a
                    href="menu.html"
                    class="landing-menu-link"
                >
                    منو
                </a>

            </header>


            <div class="hero-content">

                <span class="hero-label">
                    دم
                </span>

                <h1>
                    دم
                </h1>

                <p>
                    یک لحظه، یک نفس، یک دم‌آوری
                </p>

            </div>

        </section>



        <!-- =========================================
             MOTION 02 — PLACE
        ========================================== -->

        <section
            class="motion-section motion-place reveal-section"
        >

            <video
                class="motion-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                aria-hidden="true"
            >
                <source
                    src="video/story3.mp4"
                    type="video/mp4"
                >
            </video>

            <div class="motion-overlay"></div>


            <div class="place-content">

                <div class="place-image">

                    <picture>

                        <source
                            media="(max-width: 699px)"
                            srcset="images/storefront-mobile.jpg"
                        >

                        <img
                            src="images/damlocal.jpg"
                            alt="نمای دم"
                            loading="lazy"
                        >

                    </picture>

                </div>


                <div class="place-info">

                    <p>
                        شیراز
                    </p>

                    <p>
                        انتهای نمازی ستارخان<br>
                        خیابان کوهبر<br>
                        نرسیده به کوچه چهار
                    </p>

                    <p>
                        هر روز<br>
                        ۷:۳۰ — ۲۲:۰۰
                    </p>

                </div>

            </div>

        </section>



        <!-- =========================================
             MOTION 03 — CLOSING
        ========================================== -->

        <section
            class="motion-section motion-closing reveal-section"
        >

            <video
                class="motion-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                aria-hidden="true"
            >
                <source
                    src="video/story.mp4"
                    type="video/mp4"
                >
            </video>

            <div class="motion-overlay"></div>


            <div class="closing-content">

                <h2>
                    دم
                </h2>

                <p>
                    یک دم
                </p>

                <p>
                    یک لحظه
                </p>

            </div>

        </section>



        <!-- =========================================
             OPTIONAL STILL IMAGE
        ========================================== -->

        <section class="cascara-section reveal-section">

            <div class="cascara-image">

                <img
                    src="images/cascara.jpg"
                    alt="کاسکارا"
                    loading="lazy"
                >

            </div>


            <a
                href="https://instagram.com/damlocal"
                target="_blank"
                rel="noopener noreferrer"
                class="instagram-link"
                dir="ltr"
            >
                @damlocal
            </a>

        </section>



        <!-- =========================================
             FOOTER
        ========================================== -->

        <footer class="site-footer">

            <span>
                دم
            </span>

            <span>
                شیراز
            </span>

        </footer>


    </main>


    <script src="script.js"></script>

</body>
</html>
