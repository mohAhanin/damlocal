<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>دم | قهوه و دم‌آوری تخصصی</title>

    <meta
        name="description"
        content="دم؛ قهوه و دم‌آوری در شیراز."
    >

    <meta name="robots" content="index, follow">

    <!-- Favicon -->
    <link
        rel="icon"
        href="images/logo.jpg"
        type="image/jpeg"
    >

    <!-- Canonical -->
    <link
        rel="canonical"
        href="https://mohahanin.github.io/damlocal/"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main>

        <!-- =========================================
             MOTION 01 — CASCARA
        ========================================== -->

        <section class="motion-section motion-cascara">

            <video
                class="motion-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                aria-hidden="true"
            >
                <source src="video/cascara.mp4" type="video/mp4">
            </video>

            <div class="motion-overlay"></div>

            <header class="site-header">
                <a
                    href="https://instagram.com/damlocal"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="brand-link"
                >
                    <img src="images/logo.jpg" alt="دم" class="brand-logo">
                </a>
            </header>

            <div class="hero-content rise">

                <span class="hero-label" dir="ltr">
                    damlocal
                </span>

                <h1>دم</h1>

                <p>
                    یک لحظه، یک نفس، یک دم‌آوری
                </p>

            </div>

            <div class="hero-meta rise">
                <!-- <span>شیراز</span>
                <span>دم‌آوری</span> -->
            </div>

        </section>


        <!-- =========================================
             CRAFT
        ========================================== -->

        <section class="content-section craft-section">

            <div class="craft-images rise">

                <figure>
                    <img
                        src="images/lamarzoco.jpg"
                        alt="دستگاه قهوه"
                        loading="lazy"
                    >
                </figure>

                <figure>
                    <img
                        src="images/extraction.jpg"
                        alt="عصاره‌گیری قهوه"
                        loading="lazy"
                    >
                </figure>

            </div>

        </section>


        <!-- =========================================
             MOTION 02 — PLACE
        ========================================== -->

        <section class="motion-section motion-place">

            <video
                class="motion-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                aria-hidden="true"
            >
                <source src="video/story3.mp4" type="video/mp4">
            </video>

            <div class="motion-overlay"></div>

            <div class="motion-content place-content rise">

                <div class="place-image">
                    <picture>
                        <source
                            media="(max-width: 699px)"
                            srcset="images/storefront-mobile.jpg"
                        >

                        <img
                            src="./images/damlocal.jpg"
                            alt="نمای دم"
                            loading="lazy"
                        >
                    </picture>
                </div>

                <div class="place-info">

                    <p>شیراز</p>

                    <p>
                        انتهای نمازی ستارخان
                        خیابان کوهبر
                        نرسیده به کوچه چهار
                    </p>

                    <p>
                        هر روز<br>
                        ۷:۳۰ — ۲۲:۰۰
                    </p>

                </div>

            </div>

        </section>


        <!-- =========================================
             CASCARA IMAGE
        ========================================== -->

        <section class="content-section cascara-section">

            <div class="cascara-image rise">

                <img
                    src="images/cascara.jpg"
                    alt="کاسکارا"
                    loading="lazy"
                >

            </div>

            <a
                href="https://instagram.com/damlocal"
                target="_blank"
                rel="noopener noreferrer"
                class="instagram-link rise"
                dir="ltr"
            >
                @damlocal
            </a>

        </section>


        <!-- =========================================
             MOTION 03 — CLOSING
        ========================================== -->

        <section class="motion-section motion-closing">

            <video
                class="motion-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                aria-hidden="true"
            >
                <source src="video/story.mp4" type="video/mp4">
            </video>

            <div class="motion-overlay"></div>

            <div class="closing-content breathe">

                <h2>دم</h2>

                <p>یک دم</p>
                <p>یک لحظه</p>

            </div>

        </section>


        <!-- =========================================
             FOOTER
        ========================================== -->

        <footer class="site-footer">
            <span>دم</span>
            <span>شیراز</span>
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
